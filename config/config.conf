# ==============================
# Log Monitoring System Config
# ==============================

# Log files to monitor (comma separated)
LOG_FILES=logs/app.log,logs/sample.log

# Alert threshold for total errors
ERROR_THRESHOLD=5

# Output report files
BASE_REPORT_DIR=~/monitoring-reports

# Logs
ALERT_LOG="$HOME/log-project/logs/alerts.log"
HISTORY_LOG="$HOME/log-project/logs/history.log"
DASHBOARD_LOG="$HOME/log-project/logs/dashboard.log"

# Email alert settings
ALERT_EMAIL=your_email@example.com
SMTP_SERVER=smtp.example.com
SMTP_PORT=587
SMTP_USER=your_email@example.com
SMTP_PASS=your_app_password_here

#############################################
# AnchorPoint Monitoring - Threshold Config
#############################################

# CPU (%)
CPU_WARN=70
CPU_CRIT=90

# Memory (%)
MEM_WARN=70
MEM_CRIT=90

# Disk (%)
DISK_WARN=80
DISK_CRIT=95

# Load Average
LOAD_WARN=1.5
LOAD_CRIT=3.0
